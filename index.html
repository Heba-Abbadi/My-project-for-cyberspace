<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Project</title>
  <style>
    :root { --bg: #ffffff; --text: #1d2a3a; --accent: #2f6f6a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16202b; --text: #e8edf2; --accent: #7cc4bc; }
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1.25rem;
      line-height: 1.7;
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.25rem; }
    h2 { color: var(--accent); margin-top: 2rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>

  <h2>About</h2>

  <h2>How to use it</h2>

</html>
